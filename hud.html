<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>SpatialDrive — AR HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Share Tech Mono', monospace;
      -webkit-user-select: none;
      user-select: none;
      color: #fff;
    }

    body {
      position: relative;
      background: #000
    }

    /* ── Canvas Layer ── */
    #c {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transition: transform .2s ease;
    }

    body.mirrored #c {
      transform: scaleX(-1);
    }

    /* ── Ambient Hazard Glow / Peripheral Vignette ── */
    #hazard-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
      z-index: 10;
      border: 3px solid transparent;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(255, 110, 0, .08) 90%, rgba(255, 80, 0, .2) 100%);
    }

    #hazard-overlay.active {
      opacity: 1;
      border-color: rgba(255, 130, 0, .4);
    }

    /* ── Top Header Bar ── */
    .top-bar {
      position: fixed;
      top: 14px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      pointer-events: auto;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 4px;
      color: rgba(0, 240, 255, .7);
      text-shadow: 0 0 10px rgba(0, 240, 255, .3);
    }

    .brand-title.hazard {
      color: rgba(255, 140, 0, .9);
      text-shadow: 0 0 12px rgba(255, 140, 0, .5);
    }

    .badge-mode {
      font-size: 9px;
      letter-spacing: 1px;
      padding: 2px 7px;
      border-radius: 3px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .1);
      color: rgba(255, 255, 255, .5);
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .hud-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      letter-spacing: 1.5px;
      padding: 6px 12px;
      border-radius: 4px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .15);
      color: rgba(255, 255, 255, .7);
      cursor: pointer;
      transition: all .15s ease;
    }

    .hud-btn:hover {
      background: rgba(0, 240, 255, .12);
      border-color: rgba(0, 240, 255, .4);
      color: #fff
    }

    .hud-btn.active {
      background: rgba(0, 240, 255, .2);
      border-color: #00f0ff;
      color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, .25);
    }

    /* ── Center Hazard Warning Banner ── */
    #hazard-banner {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 4px;
      color: #FF8C00;
      opacity: 0;
      pointer-events: none;
      z-index: 25;
      padding: 8px 22px;
      border-radius: 6px;
      background: rgba(255, 90, 0, .12);
      border: 1px solid rgba(255, 140, 0, .5);
      text-shadow: 0 0 12px rgba(255, 140, 0, .8);
      box-shadow: 0 0 20px rgba(255, 140, 0, .2);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all .22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #hazard-banner.active {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Horizon Center Reticle (Vanishing Reference) ── */
    #reticle {
      position: fixed;
      top: 36%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
      opacity: .25;
      transition: opacity .3s ease;
    }

    #reticle svg {
      display: block
    }

    /* ── Bottom Telemetry Cluster ── */
    #telemetry {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 42px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, .3);
      z-index: 20;
      pointer-events: none;
      transition: color .2s ease;
    }

    #telemetry.hazard {
      color: rgba(255, 140, 0, .5)
    }

    .tel-item {
      display: inline-flex;
      align-items: center;
      gap: 8px
    }

    .tel-val {
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      font-size: 15px;
      color: rgba(255, 255, 255, .85);
      letter-spacing: 1px;
      transition: color .2s ease, text-shadow .2s ease;
    }

    #telemetry.hazard .tel-val {
      color: #FF9D00;
      text-shadow: 0 0 10px rgba(255, 140, 0, .5);
    }

    .tel-unit {
      font-size: 10px;
      opacity: .5
    }

    /* ── Connection Modal / Drawer ── */
    #conn-drawer {
      position: fixed;
      top: 54px;
      right: 18px;
      width: 280px;
      background: rgba(12, 16, 22, .92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 240, 255, .25);
      border-radius: 8px;
      padding: 16px;
      z-index: 40;
      display: none;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .8);
    }

    #conn-drawer.open {
      display: flex
    }

    .drawer-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      color: #00f0ff;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .drawer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px
    }

    .drawer-input {
      width: 100%;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 4px;
      padding: 6px 10px;
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      outline: none;
      letter-spacing: 1px;
    }

    .drawer-input:focus {
      border-color: #00f0ff
    }

    .drawer-btn {
      width: 100%;
      padding: 7px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      background: rgba(0, 240, 255, .15);
      border: 1px solid rgba(0, 240, 255, .35);
      color: #00f0ff;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      letter-spacing: 1.5px;
    }

    .drawer-btn:hover {
      background: rgba(0, 240, 255, .25)
    }

    /* ── Forced Landscape Mode (for devices with portrait lock) ── */
    body.forced-landscape {
      transform: rotate(90deg);
      transform-origin: top left;
      position: fixed;
      top: 0;
      left: 100vw;
      width: 100vh;
      height: 100vw;
      overflow: hidden;
    }

    /* ── Rotate Hint ── */
    #rotate-hint {
      position: fixed;
      bottom: 54px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Orbitron', sans-serif;
      font-size: 9.5px;
      letter-spacing: 2px;
      color: #00f0ff;
      background: rgba(0, 240, 255, .12);
      border: 1px solid rgba(0, 240, 255, .35);
      padding: 6px 16px;
      border-radius: 20px;
      pointer-events: none;
      z-index: 28;
      backdrop-filter: blur(8px);
      display: none;
      animation: pulseHint 2s infinite;
      white-space: nowrap;
    }

    @media (orientation: portrait) {
      body:not(.forced-landscape) #rotate-hint {
        display: block;
      }
    }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.35; }
    }

    /* ── Horizontal / Landscape Optimization ── */
    @media (orientation: landscape), (max-height: 520px) {
      .top-bar {
        top: 8px;
        left: 12px;
        right: 12px;
      }
      .brand-title {
        font-size: 10px;
        letter-spacing: 2.5px;
      }
      .badge-mode {
        font-size: 8px;
        padding: 1px 5px;
      }
      .controls-group {
        gap: 6px;
      }
      .hud-btn {
        font-size: 8px;
        padding: 4px 8px;
        letter-spacing: 1px;
      }
      #telemetry {
        bottom: 8px;
        gap: 28px;
        font-size: 9.5px;
      }
      .tel-val {
        font-size: 13.5px;
      }
      #hazard-banner {
        top: 38px;
        font-size: 11px;
        padding: 3px 14px;
      }
      #conn-drawer {
        top: 38px;
        right: 10px;
        max-height: 88vh;
        overflow-y: auto;
        padding: 10px;
        gap: 8px;
        width: 250px;
      }
    }
  </style>
</head>

<body>

  <canvas id="c"></canvas>
  <div id="hazard-overlay"></div>
  <div id="rotate-hint">↻ ROTATE HORIZONTALLY FOR DASHBOARD HUD</div>

  <!-- Top Navigation & Controls -->
  <div class="top-bar">
    <div class="brand-group">
      <div class="brand-title" id="brand-title">SPATIALDRIVE</div>
      <div class="badge-mode" id="status-badge">STANDBY</div>
    </div>

    <div class="controls-group">
      <a href="index.html" class="hud-btn" style="text-decoration:none;display:inline-flex;align-items:center;"
        title="Return to Launch Hub">HUB</a>
      <button class="hud-btn" id="btn-rotate" title="Force Horizontal Orientation (Shortcut: R)">HORIZONTAL</button>
      <button class="hud-btn" id="btn-mirror" title="Toggle Windshield Projection Mirroring (Shortcut: M)">HUD MIRROR:
        OFF</button>
      <button class="hud-btn" id="btn-serial" title="Connect Arduino via USB Serial">SERIAL</button>
      <button class="hud-btn" id="btn-cloud" title="Wireless Cloud Pairing">WIRELESS</button>
    </div>
  </div>

  <!-- Center Horizon Reticle -->
  <div id="reticle">
    <svg width="40" height="24" viewBox="0 0 40 24" fill="none">
      <line x1="0" y1="12" x2="14" y2="12" stroke="#00f0ff" stroke-width="1.2" />
      <circle cx="20" cy="12" r="2" stroke="#00f0ff" stroke-width="1.2" />
      <line x1="26" y1="12" x2="40" y2="12" stroke="#00f0ff" stroke-width="1.2" />
    </svg>
  </div>

  <!-- Dynamic Hazard Banner -->
  <div id="hazard-banner">
    <span>⚠ PROXIMITY HAZARD DETECTED</span>
  </div>

  <!-- Telemetry Readout -->
  <div id="telemetry">
    <div class="tel-item">
      <span>STEER</span>
      <span class="tel-val" id="tel-ang">0.0°</span>
    </div>
    <div class="tel-item">
      <span>RADIUS</span>
      <span class="tel-val" id="tel-rad">∞</span>
      <span class="tel-unit">M</span>
    </div>
    <div class="tel-item">
      <span>PROXIMITY</span>
      <span class="tel-val" id="tel-dst">---</span>
      <span class="tel-unit" id="tel-dst-unit">CM</span>
    </div>
  </div>

  <!-- Wireless Pairing Drawer -->
  <div id="conn-drawer">
    <div class="drawer-title">Wireless Pairing (MQTT)</div>
    <div style="font-size:10px;color:rgba(255,255,255,.5);line-height:1.4">
      Pair this HUD with a smartphone controller over any Wi-Fi or cellular network:
    </div>
    <div>
      <div style="font-size:9px;color:rgba(255,255,255,.4);margin-bottom:4px">PAIRING CODE</div>
      <input type="text" id="drawer-code" class="drawer-input" value="SPATIAL-77" />
    </div>
    <button class="drawer-btn" id="btn-save-code">CONNECT CLOUD</button>
    <button class="drawer-btn" id="btn-copy-ctrl-link"
      style="background:rgba(0,240,255,.1);border-color:rgba(0,240,255,.4);color:#00f0ff;margin-top:2px">📱 COPY
      CONTROLLER LINK</button>
    <div id="drawer-status" style="font-size:9px;color:rgba(0,240,255,.8);text-align:center">Ready for input</div>
  </div>

  <script>
    (() => {
      'use strict';

      /* ════════════════════════════════════════════════════════════════════════
       * 1. VEHICLE DYNAMICS & CAMERA PERSPECTIVE MODEL
       * 
       * Real Automotive Ackermann / Bicycle Trajectory Kinematics:
       *   Curvature: kappa = tan(steerAngle) / Wheelbase
       *   Turning Radius: R = 1 / kappa
       * 
       * In vehicle coordinates relative to front bumper (s = 0, theta = 0):
       *   At arc distance s along the vehicle trajectory:
       *     theta(s) = kappa * s
       *     x_center(s) = R * (1 - cos(theta(s)))
       *     y_center(s) = R * sin(theta(s))
       * 
       *   For left/right guidelines with lateral lane offset w:
       *     x(s) = R - (R - w) * cos(theta(s))
       *     y(s) = (R - w) * sin(theta(s))
       * 
       * At s = 0 (hood edge), tangent is strictly forward (dy/ds = 1, dx/ds = 0).
       * As s increases, the path curves smoothly into the turn with no inflection.
       * ════════════════════════════════════════════════════════════════════════ */
      const WHEELBASE = 2.7;        // standard midsize wheelbase (meters)
      const LANE_WIDTH = 1.50;       // HUD guide width (meters)
      const HALF_LW = LANE_WIDTH / 2;
      const CAM_HEIGHT = 1.25;       // driver eye height above road plane (m)
      const CAM_BEHIND_HOOD = 1.80;       // distance from eye to vehicle front bumper (m)
      const NEAR_S = 0.50;       // closest ground sample ahead of hood (m)
      const FAR_S = 26.0;       // maximum forward preview horizon (m)
      const MAX_HEADING_CHG = 0.72;       // ~41° max heading preview (prevents sideways drift)
      const HAZARD_THRESHOLD = 20.0;       // cm: threshold for amber hazard state

      /* ════════════════════════════════════════════════════════════════════════
       * 2. CANVAS & PROJECTION SETUP
       * ════════════════════════════════════════════════════════════════════════ */
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      let W = 0, H = 0, dpr = 1;
      let HORIZON_Y = 0;
      let FX = 0, FY = 0;

      function updateProjection() {
        const isWide = W > H;
        // In landscape widescreen, horizon at 40% height gives optimal panoramic road perspective
        HORIZON_Y = isWide ? H * 0.40 : H * 0.36;

        const camZNear = CAM_BEHIND_HOOD + NEAR_S;
        FY = (H * 0.93 - HORIZON_Y) * camZNear / CAM_HEIGHT;
        // In landscape, widen horizontal focal length FX so curves fan out across the wide horizontal screen
        FX = isWide ? FY * 1.55 : FY * 1.15;

        // Position horizon reticle
        const ret = document.getElementById('reticle');
        if (ret) ret.style.top = `${HORIZON_Y}px`;
      }

      function resize() {
        dpr = window.devicePixelRatio || 1;
        const isForced = document.body.classList.contains('forced-landscape');
        if (isForced) {
          W = window.innerHeight;
          H = window.innerWidth;
        } else {
          W = window.innerWidth;
          H = window.innerHeight;
        }
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        updateProjection();
      }
      window.addEventListener('resize', resize);
      window.addEventListener('orientationchange', () => {
        setTimeout(resize, 100);
        setTimeout(resize, 300);
      });
      resize();

      /* ── 3D Ground Point → 2D Screen Perspective ── */
      function project(x, y) {
        const depth = CAM_BEHIND_HOOD + y;
        if (depth < 0.4) return null;
        return {
          x: W / 2 + FX * (x / depth),
          y: HORIZON_Y + FY * (CAM_HEIGHT / depth)
        };
      }

      /* ── Continuous Ackermann Curve Ground Coordinate Calculator ── */
      function getGroundPoint(s, lateralOffset, steerDeg) {
        const steerRad = steerDeg * Math.PI / 180;
        // Straight line limit
        if (Math.abs(steerRad) < 0.0006) {
          return { x: lateralOffset, y: s };
        }
        const kappa = Math.tan(steerRad) / WHEELBASE;
        const R = 1 / kappa;
        const theta = kappa * s;
        return {
          x: R - (R - lateralOffset) * Math.cos(theta),
          y: (R - lateralOffset) * Math.sin(theta)
        };
      }

      /* ════════════════════════════════════════════════════════════════════════
       * 3. STATE & DAMPING ENGINE (SECOND-ORDER CRITICALLY DAMPED INTERPOLATION)
       * ════════════════════════════════════════════════════════════════════════ */
      let targetSteerAngle = 0.0; // degrees: -45.0 to +45.0
      let targetDistanceCm = 999.0;
      let steerAngle = 0.0;       // instantaneous smoothed angle
      let distanceCm = 999.0;     // instantaneous smoothed distance
      let isHazard = false;
      let isLive = false;
      let isMirrored = false;

      let smoothAngle = 0.0;
      let smoothDistance = 999.0;
      let smoothHazard = 0.0;
      const angleVelocity = { val: 0.0 };
      const distVelocity = { val: 0.0 };
      let lastFrameTime = performance.now();

      // Unity/Game-engine grade SmoothDamp (spring-damper interpolation)
      // Provides buttery smooth acceleration and deceleration over network latency spikes
      function smoothDamp(current, target, currentVelocity, smoothTime, maxSpeed, deltaTime) {
        smoothTime = Math.max(0.0001, smoothTime);
        const omega = 2 / smoothTime;
        const x = omega * deltaTime;
        const exp = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
        let change = current - target;
        const originalTo = target;

        const maxChange = maxSpeed * smoothTime;
        change = Math.max(-maxChange, Math.min(maxChange, change));
        target = current - change;

        const temp = (currentVelocity.val + omega * change) * deltaTime;
        currentVelocity.val = (currentVelocity.val - omega * temp) * exp;
        let output = target + (change + temp) * exp;

        if ((originalTo - current > 0) === (output > originalTo)) {
          output = originalTo;
          currentVelocity.val = 0;
        }
        return output;
      }

      /* ── Local BroadcastChannel (Same Device / Browser Tabs) ── */
      let bc;
      try {
        bc = new BroadcastChannel('spatialdrive');
        bc.onmessage = (e) => {
          const d = e.data;
          if (d && typeof d.angle === 'number') {
            targetSteerAngle = d.angle;
            if (typeof d.distance === 'number') targetDistanceCm = d.distance;
            onReceiveLiveData('BROADCAST');
          }
        };
      } catch (_) { }

      /* ── Cloud MQTT (Cross-Device Real-Time Wireless) ── */
      let mqttClient = null;
      const urlParams = new URLSearchParams(window.location.search);
      let roomCode = (urlParams.get('room') || 'SPATIAL-77').toUpperCase().trim();

      const drawerCodeInput = document.getElementById('drawer-code');
      if (drawerCodeInput) drawerCodeInput.value = roomCode;

      function initMqtt(code) {
        roomCode = (code || 'SPATIAL-77').toUpperCase().trim();
        if (drawerCodeInput) drawerCodeInput.value = roomCode;
        if (mqttClient) {
          try { mqttClient.end(true); } catch (_) { }
        }
        const topic = `spatialdrive/${roomCode}/telemetry`;
        const drawerStatus = document.getElementById('drawer-status');
        if (drawerStatus) drawerStatus.textContent = `Connecting (${roomCode})...`;

        try {
          mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId: 'hud_' + Math.random().toString(16).slice(2, 8),
            keepalive: 30,
            reconnectPeriod: 2000
          });

          mqttClient.on('connect', () => {
            mqttClient.subscribe(topic, { qos: 0 });
            if (drawerStatus) drawerStatus.textContent = `Connected! Room: ${roomCode}`;
            const badge = document.getElementById('status-badge');
            if (badge) badge.textContent = `ONLINE: ${roomCode}`;
          });

          mqttClient.on('message', (t, msg) => {
            try {
              const d = JSON.parse(msg.toString());
              if (d && typeof d.angle === 'number') {
                targetSteerAngle = d.angle;
                if (typeof d.distance === 'number') targetDistanceCm = d.distance;
                onReceiveLiveData('WIRELESS');
              }
            } catch (_) { }
          });

          mqttClient.on('error', () => {
            if (drawerStatus) drawerStatus.textContent = 'Cloud reconnecting...';
          });
        } catch (e) {
          if (drawerStatus) drawerStatus.textContent = 'Cloud unavailable';
        }
      }
      initMqtt(roomCode);

      /* ── Web Serial API (Arduino Uno Direct USB Connection) ── */
      let serialPort = null;
      let serialReader = null;

      async function connectSerial() {
        if (!('serial' in navigator)) {
          alert('Web Serial API not supported in this browser. Use Chrome, Edge, or Opera with OTG cable.');
          return;
        }
        try {
          serialPort = await navigator.requestPort();
          await serialPort.open({ baudRate: 115200 });
          const textDecoder = new TextDecoderStream();
          serialPort.readable.pipeTo(textDecoder.writable);
          serialReader = textDecoder.readable.getReader();
          document.getElementById('btn-serial').classList.add('active');
          document.getElementById('btn-serial').textContent = 'SERIAL: ON';

          let buffer = '';
          while (true) {
            const { value, done } = await serialReader.read();
            if (done) break;
            buffer += value;
            const lines = buffer.split('\n');
            buffer = lines.pop(); // keep partial tail
            for (const line of lines) {
              const trimmed = line.trim();
              if (trimmed.startsWith('{') && trimmed.endsWith('}')) {
                try {
                  const data = JSON.parse(trimmed);
                  if (typeof data.angle === 'number') targetSteerAngle = data.angle;
                  if (typeof data.distance === 'number') targetDistanceCm = data.distance;
                  onReceiveLiveData('SERIAL');
                } catch (_) { }
              }
            }
          }
        } catch (err) {
          console.warn('Serial error or cancelled', err);
          document.getElementById('btn-serial').classList.remove('active');
          document.getElementById('btn-serial').textContent = 'SERIAL';
        }
      }

      /* ── Live Data Reception Handler ── */
      let lastLiveTime = 0;
      let activeSource = 'STANDBY';

      function onReceiveLiveData(source) {
        isLive = true;
        lastLiveTime = performance.now();
        if (activeSource !== source) {
          activeSource = source;
          const badge = document.getElementById('status-badge');
          if (badge) {
            badge.textContent = `${source} LIVE`;
            badge.style.color = '#00f0ff';
            badge.style.borderColor = 'rgba(0,240,255,.4)';
          }
        }
      }

      function checkSourceTimeout(now) {
        if (isLive && (now - lastLiveTime > 3500)) {
          isLive = false;
          activeSource = 'STANDBY';
          const badge = document.getElementById('status-badge');
          if (badge) {
            badge.textContent = 'STANDBY';
            badge.style.color = 'rgba(255,255,255,.5)';
            badge.style.borderColor = 'rgba(255,255,255,.1)';
          }
        }
      }

      /* ════════════════════════════════════════════════════════════════════════
       * 4. HUD PROJECTION MIRRORING & ORIENTATION CONTROLS
       * ════════════════════════════════════════════════════════════════════════ */
      const btnMirror = document.getElementById('btn-mirror');
      function toggleMirror() {
        isMirrored = !isMirrored;
        document.body.classList.toggle('mirrored', isMirrored);
        btnMirror.textContent = `HUD MIRROR: ${isMirrored ? 'ON' : 'OFF'}`;
        btnMirror.classList.toggle('active', isMirrored);
      }
      btnMirror.addEventListener('click', toggleMirror);

      const btnRotate = document.getElementById('btn-rotate');
      async function toggleRotate() {
        const isForced = document.body.classList.toggle('forced-landscape');
        if (btnRotate) {
          btnRotate.classList.toggle('active', isForced);
          btnRotate.textContent = isForced ? 'ROTATE: 90°' : 'HORIZONTAL';
        }
        if (isForced) {
          try {
            if (document.documentElement.requestFullscreen) {
              await document.documentElement.requestFullscreen();
            }
            if (screen.orientation && screen.orientation.lock) {
              await screen.orientation.lock('landscape');
            }
          } catch (_) {}
        } else {
          try {
            if (screen.orientation && screen.orientation.unlock) {
              screen.orientation.unlock();
            }
            if (document.exitFullscreen && document.fullscreenElement) {
              await document.exitFullscreen();
            }
          } catch (_) {}
        }
        setTimeout(resize, 80);
        setTimeout(resize, 260);
      }
      if (btnRotate) btnRotate.addEventListener('click', toggleRotate);

      function broadcastSteer() {
        if (bc) {
          try {
            bc.postMessage({ angle: Number(targetSteerAngle.toFixed(1)), distance: targetDistanceCm });
          } catch (_) { }
        }
      }

      /* ── Interactive Manual Steering (Keys & Mouse/Touch Drag) ── */
      window.addEventListener('keydown', (e) => {
        if (e.key === 'm' || e.key === 'M') {
          toggleMirror();
          return;
        }
        if (e.key === 'r' || e.key === 'R') {
          toggleRotate();
          return;
        }
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
          targetSteerAngle = Math.max(-45, targetSteerAngle - (e.shiftKey ? 5.0 : 2.0));
          onReceiveLiveData('MANUAL');
          broadcastSteer();
        } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
          targetSteerAngle = Math.min(45, targetSteerAngle + (e.shiftKey ? 5.0 : 2.0));
          onReceiveLiveData('MANUAL');
          broadcastSteer();
        } else if (e.key === ' ' || e.key === '0' || e.key === 'c' || e.key === 'C') {
          targetSteerAngle = 0.0;
          onReceiveLiveData('MANUAL');
          broadcastSteer();
        }
      });

      let isDraggingHUD = false;
      canvas.addEventListener('pointerdown', (e) => {
        if (e.clientY > H * 0.22) {
          isDraggingHUD = true;
          canvas.setPointerCapture(e.pointerId);
          handlePointerSteer(e.clientX, e.clientY);
        }
      });
      canvas.addEventListener('pointermove', (e) => {
        if (isDraggingHUD) handlePointerSteer(e.clientX, e.clientY);
      });
      function endDrag() { isDraggingHUD = false; }
      canvas.addEventListener('pointerup', endDrag);
      canvas.addEventListener('pointercancel', endDrag);
      canvas.addEventListener('dblclick', () => {
        targetSteerAngle = 0.0;
        onReceiveLiveData('MANUAL');
        broadcastSteer();
      });

      function handlePointerSteer(clientX, clientY) {
        let x = clientX;
        const isForced = document.body.classList.contains('forced-landscape');
        if (isForced) x = clientY;
        const ratio = (x / W) * 2 - 1; // -1 to +1
        targetSteerAngle = Math.max(-45, Math.min(45, ratio * 45));
        onReceiveLiveData('MANUAL');
        broadcastSteer();
      }

      document.getElementById('btn-serial').addEventListener('click', connectSerial);

      const connDrawer = document.getElementById('conn-drawer');
      document.getElementById('btn-cloud').addEventListener('click', () => {
        connDrawer.classList.toggle('open');
      });
      document.getElementById('btn-save-code').addEventListener('click', () => {
        const val = document.getElementById('drawer-code').value;
        if (val) initMqtt(val);
      });

      const copyCtrlBtn = document.getElementById('btn-copy-ctrl-link');
      if (copyCtrlBtn) {
        copyCtrlBtn.addEventListener('click', () => {
          const ctrlUrl = new URL(`controller.html?room=${encodeURIComponent(roomCode)}`, window.location.href).href;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(ctrlUrl).then(() => {
              copyCtrlBtn.textContent = 'COPIED TO CLIPBOARD!';
              setTimeout(() => { copyCtrlBtn.textContent = '📱 COPY CONTROLLER LINK'; }, 2000);
            }).catch(() => {
              prompt('Copy controller link for this room:', ctrlUrl);
            });
          } else {
            prompt('Copy controller link for this room:', ctrlUrl);
          }
        });
      }

      /* ════════════════════════════════════════════════════════════════════════
       * 5. GRAPHICS & RENDERING PIPELINE
       * ════════════════════════════════════════════════════════════════════════ */
      // Palette definition: Cyan/White (Normal) vs Amber/Orange (Hazard)
      const COLOR_NORMAL = { r: 0, g: 240, b: 255 }; // Holographic Cyan
      const COLOR_HAZARD = { r: 255, g: 130, b: 0 }; // Warning Amber
      const COLOR_CORE = { r: 245, g: 252, b: 255 };

      function lerpCol(c1, c2, t) {
        return {
          r: c1.r + (c2.r - c1.r) * t,
          g: c1.g + (c2.g - c1.g) * t,
          b: c1.b + (c2.b - c1.b) * t
        };
      }
      function rgba(c, a) {
        return `rgba(${c.r | 0},${c.g | 0},${c.b | 0},${Math.max(0, Math.min(1, a))})`;
      }

      /* ── Multi-pass Luminous Stroke ── */
      function strokeGlowPolyline(pts, col, baseAlpha) {
        if (pts.length < 2) return;

        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Outer Bloom
        ctx.lineWidth = 16;
        ctx.strokeStyle = rgba(col, baseAlpha * 0.08);
        ctx.stroke();

        // Secondary Aura
        ctx.lineWidth = 7;
        ctx.strokeStyle = rgba(col, baseAlpha * 0.22);
        ctx.stroke();

        // Medium Halo
        ctx.lineWidth = 3.2;
        ctx.strokeStyle = rgba(col, baseAlpha * 0.65);
        ctx.stroke();

        // Sharp Core
        ctx.lineWidth = 1.4;
        ctx.strokeStyle = rgba(COLOR_CORE, baseAlpha * 0.95);
        ctx.stroke();
      }

      /* ── Build 2D Projected Guideline Points ── */
      function buildProjectedLine(steerDeg, sign, maxArcDist, numSteps = 55) {
        const lateralOffset = sign * HALF_LW;
        const pts = [];

        for (let i = 0; i <= numSteps; i++) {
          const s = NEAR_S + (i / numSteps) * (maxArcDist - NEAR_S);
          const gp = getGroundPoint(s, lateralOffset, steerDeg);
          const p = project(gp.x, gp.y);
          if (p) {
            // Frustum clip
            if (p.y >= HORIZON_Y - 10 && p.y <= H + 50 && p.x >= -300 && p.x <= W + 300) {
              pts.push(p);
            }
          }
        }
        return pts;
      }

      /* ── Render Transverse Distance Crossbar ── */
      function drawCrossbar(sDist, steerDeg, col, alpha, isHazardBar = false) {
        const numSub = 16;
        const pts = [];

        for (let i = 0; i <= numSub; i++) {
          const frac = i / numSub; // 0 (left) to 1 (right)
          const lat = -HALF_LW + frac * LANE_WIDTH;
          const gp = getGroundPoint(sDist, lat, steerDeg);
          const p = project(gp.x, gp.y);
          if (p && p.y >= HORIZON_Y) pts.push(p);
        }
        if (pts.length < 2) return;

        if (isHazardBar) {
          // High-intensity obstacle detection gate
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.lineWidth = 18;
          ctx.strokeStyle = rgba(col, 0.25);
          ctx.stroke();

          ctx.lineWidth = 6;
          ctx.strokeStyle = rgba(col, 0.75);
          ctx.stroke();

          ctx.lineWidth = 2.5;
          ctx.strokeStyle = '#fff';
          ctx.stroke();

          // Hazard diamond marker in center of bar
          const mid = pts[Math.floor(pts.length / 2)];
          ctx.save();
          ctx.fillStyle = rgba(col, 0.9);
          ctx.beginPath();
          ctx.arc(mid.x, mid.y, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else {
          // Subtle distance reference bar
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.lineWidth = 3.5;
          ctx.strokeStyle = rgba(col, alpha * 0.35);
          ctx.stroke();

          ctx.lineWidth = 1.2;
          ctx.strokeStyle = rgba(col, alpha * 0.75);
          ctx.stroke();
        }
      }

      /* ── Dynamic Horizon Steering Compass Tape ── */
      function drawHorizonSteeringCompass(steerDeg, col) {
        ctx.save();
        const centerX = W / 2;
        const y = HORIZON_Y;
        const pxPerDeg = Math.min(W * 0.012, 10.5);

        // Subtle horizon baseline
        ctx.beginPath();
        ctx.moveTo(centerX - W * 0.32, y);
        ctx.lineTo(centerX + W * 0.32, y);
        ctx.strokeStyle = rgba(col, 0.15);
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.font = '9px "Share Tech Mono", monospace';

        // Ticks from -40° to +40°
        for (let deg = -40; deg <= 40; deg += 5) {
          const tickX = centerX + (deg - steerDeg) * pxPerDeg;
          if (tickX < centerX - W * 0.34 || tickX > centerX + W * 0.34) continue;

          const isMajor = deg % 10 === 0;
          const tickLen = isMajor ? 7 : 3.5;
          const distNorm = Math.abs(tickX - centerX) / (W * 0.34);
          const alpha = (1 - distNorm * distNorm) * (isMajor ? 0.65 : 0.22);

          ctx.beginPath();
          ctx.moveTo(tickX, y - tickLen);
          ctx.lineTo(tickX, y);
          ctx.strokeStyle = rgba(col, alpha);
          ctx.lineWidth = isMajor ? 1.4 : 0.8;
          ctx.stroke();

          if (isMajor && deg !== 0) {
            ctx.fillStyle = rgba(col, alpha * 0.85);
            ctx.fillText(`${Math.abs(deg)}°`, tickX, y - tickLen - 2);
          }
        }

        // Center reticle reference indicator
        ctx.fillStyle = rgba(col, 0.95);
        ctx.beginPath();
        ctx.moveTo(centerX, y - 6);
        ctx.lineTo(centerX + 3.5, y);
        ctx.lineTo(centerX, y + 6);
        ctx.lineTo(centerX - 3.5, y);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      /* ════════════════════════════════════════════════════════════════════════
       * 6. MAIN RENDER LOOP (BUTTER-SMOOTH ROTATION & KINEMATICS)
       * ════════════════════════════════════════════════════════════════════════ */
      function render(timestamp) {
        requestAnimationFrame(render);

        // High-precision frame delta time calculation (capped to prevent leaps after tab backgrounding)
        const now = performance.now();
        const dt = Math.min(0.05, Math.max(0.001, (now - lastFrameTime) / 1000));
        lastFrameTime = now;

        // Check timeout for external live feed
        checkSourceTimeout(timestamp);

        // Second-order critically damped smooth interpolation:
        // SmoothTime = 0.11s produces silky smooth, continuous rotation even with 100-250ms packet latency!
        smoothAngle = smoothDamp(smoothAngle, targetSteerAngle, angleVelocity, 0.11, 350, dt);
        steerAngle = smoothAngle;

        // Smooth obstacle distance damping
        smoothDistance = smoothDamp(smoothDistance, targetDistanceCm, distVelocity, 0.15, 800, dt);
        distanceCm = smoothDistance;

        const targetHazard = (distanceCm < HAZARD_THRESHOLD) ? 1.0 : 0.0;
        smoothHazard += (targetHazard - smoothHazard) * Math.min(1.0, 10.0 * dt);
        isHazard = smoothHazard > 0.35;

        // ── Smooth Horizon Reticle Banking ──
        const ret = document.getElementById('reticle');
        if (ret) {
          ret.style.transform = `translate(-50%, -50%) rotate(${-smoothAngle * 0.22}deg)`;
        }

        // ── Update DOM Telemetry ──
        const banner = document.getElementById('hazard-banner');
        const overlay = document.getElementById('hazard-overlay');
        const telemetry = document.getElementById('telemetry');
        const brand = document.getElementById('brand-title');

        if (banner) banner.classList.toggle('active', isHazard);
        if (overlay) overlay.classList.toggle('active', isHazard);
        if (telemetry) telemetry.classList.toggle('hazard', isHazard);
        if (brand) brand.classList.toggle('hazard', isHazard);

        // Steer angle & turning radius readout
        const telAng = document.getElementById('tel-ang');
        if (telAng) {
          const signStr = smoothAngle > 0.05 ? '+' : '';
          telAng.textContent = `${signStr}${smoothAngle.toFixed(1)}°`;
        }

        const telRad = document.getElementById('tel-rad');
        if (telRad) {
          const rad = Math.abs(smoothAngle) > 0.1
            ? (WHEELBASE / Math.abs(Math.tan(smoothAngle * Math.PI / 180))).toFixed(1)
            : '∞';
          telRad.textContent = rad;
        }

        const telDst = document.getElementById('tel-dst');
        if (telDst) {
          telDst.textContent = distanceCm < 400 ? distanceCm.toFixed(0) : '---';
        }

        // ── Clear Frame ──
        ctx.clearRect(0, 0, W, H);

        // Dynamic active palette
        const activeColor = lerpCol(COLOR_NORMAL, COLOR_HAZARD, smoothHazard);

        // ── 0. Draw Horizon Digital Steering Compass Tape ──
        drawHorizonSteeringCompass(smoothAngle, activeColor);

        // ── Compute Geometry Lookahead ──
        const steerRad = smoothAngle * Math.PI / 180;
        const kappa = Math.abs(steerRad) > 0.0005 ? Math.tan(steerRad) / WHEELBASE : 0;
        const absR = kappa !== 0 ? Math.abs(1 / kappa) : Infinity;

        // Dynamically clamp lookahead arc distance so heading doesn't exceed visual FOV
        const maxLookahead = Math.min(FAR_S, Math.max(7.0, absR * MAX_HEADING_CHG));

        // ── 1. Draw Left & Right Primary Trajectory Guidelines ──
        const leftPts = buildProjectedLine(smoothAngle, -1, maxLookahead);
        const rightPts = buildProjectedLine(smoothAngle, +1, maxLookahead);

        strokeGlowPolyline(leftPts, activeColor, 1.0);
        strokeGlowPolyline(rightPts, activeColor, 1.0);

        // ── 2. Draw Transverse Distance Rungs ──
        const distanceMarkers = [3.5, 7.0, 12.0, 18.0];
        for (const dM of distanceMarkers) {
          if (dM < maxLookahead * 0.95) {
            const rungAlpha = Math.max(0.15, 1 - (dM / maxLookahead));
            drawCrossbar(dM, smoothAngle, activeColor, rungAlpha, false);
          }
        }

        // ── 4. Dynamic Ultrasonic Obstacle Ground Barrier ──
        const obstacleMeters = distanceCm / 100.0;
        if (obstacleMeters >= NEAR_S && obstacleMeters <= Math.min(18.0, maxLookahead)) {
          const isCritical = distanceCm < HAZARD_THRESHOLD;
          drawCrossbar(obstacleMeters, smoothAngle, isCritical ? COLOR_HAZARD : activeColor, 1.0, isCritical);
        }

        // ── 5. Atmospheric Horizon Distance Gradient (Horizon Fade) ──
        const fadeDepth = HORIZON_Y + H * 0.18;
        const grad = ctx.createLinearGradient(0, HORIZON_Y - 20, 0, fadeDepth);
        grad.addColorStop(0, 'rgba(0,0,0,1)');
        grad.addColorStop(0.5, 'rgba(0,0,0,0.7)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, fadeDepth);
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>

</html>
