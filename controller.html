<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SpatialDrive — Steering Wheel Controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#07090e;
    font-family:'Share Tech Mono',monospace;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
    color:#fff;
  }
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:16px 14px 14px;
    background:radial-gradient(ellipse at 50% 45%, #101624 0%, #06080d 75%, #030407 100%);
  }

  /* ── Header ── */
  .header{
    width:100%;max-width:460px;
    display:flex;justify-content:space-between;align-items:center;
    z-index:10;
  }
  .brand-group{display:flex;align-items:center;gap:8px}
  .brand{
    font-family:'Orbitron',sans-serif;font-weight:800;font-size:12px;
    letter-spacing:4px;color:#00f0ff;
    text-shadow:0 0 12px rgba(0,240,255,.4);
  }
  .badge-model{
    font-size:9px;letter-spacing:1px;padding:2px 6px;border-radius:3px;
    background:rgba(0,240,255,.08);border:1px solid rgba(0,240,255,.25);
    color:rgba(0,240,255,.8);
  }
  .header-actions{display:flex;gap:6px}
  .chip-btn{
    font-family:'Orbitron',sans-serif;font-size:8.5px;letter-spacing:1px;
    padding:5px 8px;border-radius:4px;cursor:pointer;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);
    color:rgba(255,255,255,.6);transition:all .15s ease;
  }
  .chip-btn:hover{color:#fff;border-color:rgba(255,255,255,.3)}
  .chip-btn.active{
    background:rgba(0,240,255,.16);border-color:#00f0ff;color:#00f0ff;
    box-shadow:0 0 8px rgba(0,240,255,.25);
  }

  /* ── Telemetry & Direction Readout Cluster ── */
  .telemetry-cluster{
    width:100%;max-width:440px;
    display:flex;flex-direction:column;align-items:center;
    margin-top:2px;
  }
  .angle-display{
    display:flex;align-items:baseline;justify-content:center;gap:6px;
  }
  .readout-arrow{
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:24px;
    color:rgba(255,255,255,.15);transition:color .12s ease, text-shadow .12s ease;
  }
  .readout-arrow.active{
    color:#00f0ff;text-shadow:0 0 14px rgba(0,240,255,.7);
  }
  .readout-arrow.hazard.active{
    color:#FF8C00;text-shadow:0 0 14px rgba(255,140,0,.8);
  }
  .readout{
    font-family:'Orbitron',sans-serif;font-weight:900;
    font-size:clamp(40px, 11vw, 56px);
    color:#fff;letter-spacing:-1px;min-width:160px;text-align:center;
    text-shadow:0 0 20px rgba(0,240,255,.2);
    transition:color .15s ease, text-shadow .15s ease;
  }
  .readout.hazard{
    color:#FF9D00;text-shadow:0 0 24px rgba(255,140,0,.6);
  }
  .direction-sub{
    font-size:10px;letter-spacing:4px;color:rgba(255,255,255,.35);
    margin-top:-2px;text-transform:uppercase;
  }

  /* ── Steering Wheel Stage ── */
  .wheel-stage{
    position:relative;width:100%;max-width:440px;
    display:flex;align-items:center;justify-content:center;
    margin:auto 0;
  }

  /* Paddle Shifters (Left & Right) */
  .paddle-shifter{
    position:absolute;top:50%;transform:translateY(-50%);
    width:42px;height:120px;
    background:linear-gradient(180deg, #1f2735 0%, #0d121c 50%, #171d2b 100%);
    border:1px solid rgba(255,255,255,.15);
    border-radius:10px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:10px 0;z-index:5;
    box-shadow:0 8px 24px rgba(0,0,0,.6), inset 0 1px 1px rgba(255,255,255,.15);
    transition:all .1s cubic-bezier(0.16,1,0.3,1);
  }
  .paddle-shifter:active{
    box-shadow:0 2px 10px rgba(0,0,0,.8);
  }
  .paddle-left{left:4px;border-top-right-radius:4px;border-bottom-right-radius:4px}
  .paddle-left:active{transform:translateY(-50%) translateX(-4px) rotate(-4deg)}
  .paddle-right{right:4px;border-top-left-radius:4px;border-bottom-left-radius:4px}
  .paddle-right:active{transform:translateY(-50%) translateX(4px) rotate(4deg)}
  .paddle-label{
    font-family:'Orbitron',sans-serif;font-weight:800;font-size:16px;
    color:rgba(0,240,255,.8);text-shadow:0 0 8px rgba(0,240,255,.4);
  }
  .paddle-sub{font-size:8px;letter-spacing:1px;color:rgba(255,255,255,.3)}

  /* Circular Interactive Steering Wheel Container */
  .wheel-container{
    position:relative;
    width:min(78vw, 320px);
    height:min(78vw, 320px);
    touch-action:none;cursor:grab;
    display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 14px 30px rgba(0,0,0,.75));
  }
  .wheel-container:active{cursor:grabbing}

  /* Angular Gauge Ring */
  .gauge-ring{
    position:absolute;width:100%;height:100%;
    pointer-events:none;z-index:2;
  }

  /* SVG Wheel Graphic */
  #wheel-svg{
    width:100%;height:100%;
    display:block;
    transform-origin:50% 50%;
    will-change:transform;
    transition:filter .2s ease;
  }
  #wheel-svg.hazard{
    filter:drop-shadow(0 0 18px rgba(255,140,0,.5));
  }

  /* Center Horn & Snap Button inside Hub */
  .horn-hitbox{
    position:absolute;
    width:32%;height:32%;
    border-radius:50%;
    cursor:pointer;z-index:20;
    background:transparent;
    display:flex;align-items:center;justify-content:center;
  }

  /* Quick Degree Tick Labels around Wheel */
  .wheel-angle-ticks{
    position:absolute;bottom:-20px;left:0;right:0;
    display:flex;justify-content:space-between;
    font-size:9px;color:rgba(255,255,255,.25);letter-spacing:1px;
    padding:0 24px;pointer-events:none;
  }

  /* ── Proximity Hazard Section ── */
  .distance-section{
    width:100%;max-width:440px;
    background:rgba(14,18,26,.65);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.08);border-radius:10px;
    padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;
    z-index:10;
  }
  .distance-header{
    width:100%;display:flex;justify-content:space-between;align-items:center;
    font-size:9.5px;letter-spacing:2px;color:rgba(255,255,255,.3);
  }
  .dual-dist-row{
    width:100%;display:flex;gap:10px;justify-content:space-between;
  }
  .sensor-card{
    flex:1;background:rgba(255,255,255,.02);
    border:1px solid rgba(255,255,255,.08);border-radius:8px;
    padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;
    transition:border-color .2s ease, background .2s ease;
  }
  .sensor-card.yellow{
    border-color:rgba(255,215,0,.5);background:rgba(255,215,0,.06);
  }
  .sensor-card.yellow .dist-val{
    color:#FFD700;text-shadow:0 0 14px rgba(255,215,0,.7);
  }
  .sensor-card.hazard{
    border-color:rgba(255,140,0,.6);background:rgba(255,140,0,.08);
  }
  .sensor-title{
    font-size:8.5px;letter-spacing:1.5px;color:rgba(255,255,255,.4);font-weight:700;
  }
  .sensor-card.yellow .sensor-title{color:#FFD700}
  .sensor-card.hazard .sensor-title{color:#FF8C00}
  .dist-stepper{
    display:flex;align-items:center;gap:12px;
  }
  .dist-btn{
    width:30px;height:30px;border-radius:50%;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);
    color:#fff;font-family:'Orbitron',sans-serif;font-size:14px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .15s ease;
  }
  .dist-btn:hover{background:rgba(0,240,255,.15);border-color:#00f0ff}
  .dist-val{
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:16px;
    min-width:65px;text-align:center;color:#fff;
    transition:color .2s ease;
  }
  .dist-val.hazard{color:#FF8C00;text-shadow:0 0 14px rgba(255,140,0,.6)}

  /* Presets */
  .presets{display:flex;gap:6px;width:100%;justify-content:center}
  .preset-btn{
    flex:1;max-width:90px;padding:5px 0;border-radius:4px;
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);
    color:rgba(255,255,255,.5);font-size:8.5px;font-family:'Orbitron',sans-serif;
    cursor:pointer;text-align:center;transition:all .15s ease;
  }
  .preset-btn.test-btn-yellow{
    border-color:rgba(255,215,0,.35);color:rgba(255,215,0,.85);
  }
  .preset-btn.test-btn-yellow:hover{
    background:rgba(255,215,0,.15);color:#FFD700;
  }
  .preset-btn.hazard-preset{
    border-color:rgba(255,140,0,.35);color:rgba(255,140,0,.8);
  }
  .preset-btn.hazard-preset:hover{
    background:rgba(255,140,0,.15);color:#FF8C00;
  }
  .preset-btn:hover{background:rgba(255,255,255,.08);color:#fff}

  /* ── Cockpit Acceleration & Brake Pedals Stage ── */
  .pedals-stage{
    width:100%;max-width:440px;
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;
    margin:6px 0;
    z-index:10;
  }
  .pedal-btn{
    flex:1;height:56px;
    background:linear-gradient(180deg, #182230 0%, #0c121c 100%);
    border:1px solid rgba(255,255,255,.15);
    border-radius:8px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;
    box-shadow:0 6px 16px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.15);
    transition:all .1s cubic-bezier(0.16,1,0.3,1);
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
    user-select:none;
  }
  .pedal-btn:active, .pedal-btn.pressed{
    transform:scale(0.96) translateY(2px);
  }
  .pedal-brake{
    border-color:rgba(255,90,0,.3);
  }
  .pedal-brake:active, .pedal-brake.pressed{
    background:linear-gradient(180deg, rgba(255,80,0,.25) 0%, rgba(200,40,0,.35) 100%);
    border-color:#FF5500;
    box-shadow:0 0 16px rgba(255,85,0,.45);
  }
  .pedal-gas{
    border-color:rgba(0,240,255,.3);
  }
  .pedal-gas:active, .pedal-gas.pressed{
    background:linear-gradient(180deg, rgba(0,240,255,.25) 0%, rgba(0,140,255,.35) 100%);
    border-color:#00f0ff;
    box-shadow:0 0 16px rgba(0,240,255,.45);
  }
  .pedal-face{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    pointer-events:none;z-index:2;
  }
  .pedal-icon{font-size:13px;line-height:1}
  .pedal-brake .pedal-icon{color:#FF7700}
  .pedal-gas .pedal-icon{color:#00f0ff}
  .pedal-text{
    font-family:'Orbitron',sans-serif;font-weight:800;font-size:9.5px;
    letter-spacing:1.5px;color:#fff;
  }
  .pedal-sub{font-size:7.5px;letter-spacing:1px;color:rgba(255,255,255,.3)}

  /* Center Cockpit Dash: Live Speed & RPM Bar */
  .cockpit-dash{
    flex:1.2;
    background:rgba(10,14,22,.85);backdrop-filter:blur(10px);
    border:1px solid rgba(0,240,255,.25);border-radius:8px;
    padding:6px 10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.6);
  }
  .dash-speed-group{
    display:flex;align-items:baseline;gap:4px;
  }
  .dash-speed-val{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:26px;
    color:#00f0ff;text-shadow:0 0 12px rgba(0,240,255,.5);
    letter-spacing:-0.5px;line-height:1;
  }
  .dash-speed-unit{
    font-size:8.5px;letter-spacing:1.5px;color:rgba(0,240,255,.6);
  }
  .dash-rpm-meter{
    width:100%;height:4px;background:rgba(255,255,255,.08);
    border-radius:2px;margin-top:4px;overflow:hidden;
  }
  .dash-rpm-bar{
    height:100%;width:0%;
    background:linear-gradient(90deg, #00f0ff 0%, #00ff88 65%, #ffcc00 85%, #ff3300 100%);
    transition:width .05s linear;
  }

  /* ── Bottom Status Bar ── */
  .bottom-bar{
    width:100%;max-width:440px;
    display:flex;justify-content:space-between;align-items:center;
    font-size:8.5px;letter-spacing:1.5px;color:rgba(255,255,255,.25);
    padding-top:6px;z-index:10;
  }
  .status-dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:#00f0ff;box-shadow:0 0 6px #00f0ff;margin-right:6px;
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="brand-group">
    <div class="brand">SPATIALDRIVE</div>
    <div class="badge-model">WHEEL</div>
  </div>
  <div class="header-actions">
    <a href="index.html" class="chip-btn" style="text-decoration:none;display:inline-flex;align-items:center;" title="Return to Launch Hub">HUB</a>
    <button class="chip-btn" id="btn-ctrl-serial" title="Connect Arduino Nano via USB (9600 Baud)">NANO USB</button>
    <button class="chip-btn active" id="btn-autocenter" title="Toggle Auto Return to Center Spring">SPRING: ON</button>
    <button class="chip-btn" id="btn-gyro" title="Toggle Phone Gyroscope / Tilt Steering">GYRO: OFF</button>
    <button class="chip-btn" id="btn-audio" title="Audio Alert & Mechanical Clicks">AUDIO: ON</button>
  </div>
</div>

<!-- Telemetry & Dynamic Direction Readout -->
<div class="telemetry-cluster">
  <div class="angle-display">
    <span class="readout-arrow" id="arrow-left">◀</span>
    <div class="readout" id="angle-readout">0.0°</div>
    <span class="readout-arrow" id="arrow-right">▶</span>
  </div>
  <div class="direction-sub" id="direction-sub">CENTERED</div>
</div>

<!-- Main Steering Wheel Stage -->
<div class="wheel-stage">
  <!-- Left Paddle Shifter (-5°) -->
  <button class="paddle-shifter paddle-left" id="paddle-left" title="Shift Left −5°">
    <span class="paddle-label">−</span>
    <span class="paddle-sub">5°</span>
  </button>

  <!-- Interactive Steering Wheel -->
  <div class="wheel-container" id="wheel-container">
    <!-- Center Horn Hitbox (Double-click or tap center to snap 0° & horn) -->
    <div class="horn-hitbox" id="horn-hitbox" title="Tap Horn / Snap Re-Center [0°]"></div>

    <!-- Scalable High-Fidelity SVG Steering Wheel -->
    <svg id="wheel-svg" viewBox="0 0 340 340" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Outer Rim 3D Radial Depth -->
        <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
          <stop offset="78%" stop-color="#1c212c"/>
          <stop offset="88%" stop-color="#2d3546"/>
          <stop offset="94%" stop-color="#141822"/>
          <stop offset="100%" stop-color="#0a0c12"/>
        </radialGradient>

        <!-- Inner Rim Shadow -->
        <radialGradient id="innerBevel" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#080b11"/>
          <stop offset="85%" stop-color="#101520"/>
          <stop offset="100%" stop-color="#2a3344"/>
        </radialGradient>

        <!-- Brushed Titanium Spoke Gradient -->
        <linearGradient id="spokeGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2c3444"/>
          <stop offset="45%" stop-color="#181e2b"/>
          <stop offset="80%" stop-color="#343d50"/>
          <stop offset="100%" stop-color="#121620"/>
        </linearGradient>

        <!-- Spoke Cutout Accent -->
        <linearGradient id="slotGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#07090e"/>
          <stop offset="100%" stop-color="#151b27"/>
        </linearGradient>

        <!-- Center Boss Carbon Texture Pattern -->
        <pattern id="carbonPattern" width="6" height="6" patternUnits="userSpaceOnUse">
          <rect width="6" height="6" fill="#121620"/>
          <polygon points="0,0 3,0 6,3 6,6 3,6 0,3" fill="#181e2c"/>
          <polygon points="3,0 6,0 6,3" fill="#202738"/>
          <polygon points="0,3 3,6 0,6" fill="#0d1118"/>
        </pattern>

        <!-- Perforated Grip Texture Pattern -->
        <pattern id="perforatedGrip" width="8" height="8" patternUnits="userSpaceOnUse">
          <circle cx="4" cy="4" r="1.1" fill="#0b0e14" opacity="0.8"/>
        </pattern>
      </defs>

      <!-- ── 1. OUTER RIM BODY ── -->
      <!-- Shadow base -->
      <circle cx="170" cy="170" r="152" fill="#06080d" stroke="#121620" stroke-width="2"/>
      
      <!-- Primary Wheel Rim Tube -->
      <circle cx="170" cy="170" r="139" stroke="url(#rimGrad)" stroke-width="27"/>
      
      <!-- Ergonomic 9 & 3 o'clock Thumb Grip Overlays with Perforation -->
      <path d="M 31 130 A 139 139 0 0 1 31 210" stroke="#181d27" stroke-width="29" stroke-linecap="round"/>
      <path d="M 31 130 A 139 139 0 0 1 31 210" stroke="url(#perforatedGrip)" stroke-width="29" stroke-linecap="round"/>
      
      <path d="M 309 130 A 139 139 0 0 0 309 210" stroke="#181d27" stroke-width="29" stroke-linecap="round"/>
      <path d="M 309 130 A 139 139 0 0 0 309 210" stroke="url(#perforatedGrip)" stroke-width="29" stroke-linecap="round"/>

      <!-- Inner Rim Chrome Ring Trim -->
      <circle cx="170" cy="170" r="125" stroke="rgba(255,255,255,.14)" stroke-width="1.2"/>

      <!-- ── 2. 12 O'CLOCK RACING CENTERING STRIPE ── -->
      <rect id="racing-stripe" x="165" y="17" width="10" height="26" rx="2" fill="#00f0ff" filter="drop-shadow(0 0 6px #00f0ff)"/>

      <!-- ── 3. SPOKES STRUCTURE (3-SPOKE MOTORSPORT) ── -->
      <!-- Left Horizontal Spoke -->
      <path d="M 124 156 L 46 158 L 46 182 L 124 184 Z" fill="url(#spokeGrad)" stroke="#131720" stroke-width="1"/>
      <!-- Left Spoke Weight Slot -->
      <rect x="58" y="166" width="50" height="8" rx="4" fill="url(#slotGrad)" stroke="rgba(255,255,255,.08)"/>

      <!-- Right Horizontal Spoke -->
      <path d="M 216 156 L 294 158 L 294 182 L 216 184 Z" fill="url(#spokeGrad)" stroke="#131720" stroke-width="1"/>
      <!-- Right Spoke Weight Slot -->
      <rect x="232" y="166" width="50" height="8" rx="4" fill="url(#slotGrad)" stroke="rgba(255,255,255,.08)"/>

      <!-- Bottom Vertical Spoke -->
      <path d="M 158 214 L 157 292 L 183 292 L 182 214 Z" fill="url(#spokeGrad)" stroke="#131720" stroke-width="1"/>
      <!-- Bottom Spoke Weight Slot -->
      <rect x="166" y="228" width="8" height="50" rx="4" fill="url(#slotGrad)" stroke="rgba(255,255,255,.08)"/>

      <!-- Spoke Rivets / Bolts -->
      <circle cx="120" cy="160" r="2.2" fill="#4a5568" stroke="#121620"/>
      <circle cx="120" cy="180" r="2.2" fill="#4a5568" stroke="#121620"/>
      <circle cx="220" cy="160" r="2.2" fill="#4a5568" stroke="#121620"/>
      <circle cx="220" cy="180" r="2.2" fill="#4a5568" stroke="#121620"/>
      <circle cx="162" cy="220" r="2.2" fill="#4a5568" stroke="#121620"/>
      <circle cx="178" cy="220" r="2.2" fill="#4a5568" stroke="#121620"/>

      <!-- ── 4. CENTER HORN BOSS / HUB ── -->
      <!-- Outer Hub Metal Bezel -->
      <circle cx="170" cy="170" r="50" fill="#181d27" stroke="rgba(0,240,255,.4)" stroke-width="2" id="hub-ring"/>
      <!-- Inner Carbon Disc -->
      <circle cx="170" cy="170" r="44" fill="url(#carbonPattern)"/>

      <!-- Telemetry Steering LEDs Arc across Top Hub -->
      <!-- Left LEDs: -40°, -30°, -20°, -10° -->
      <circle id="led-l4" cx="132" cy="144" r="2.5" fill="#331111"/>
      <circle id="led-l3" cx="140" cy="136" r="2.5" fill="#332211"/>
      <circle id="led-l2" cx="150" cy="131" r="2.5" fill="#112d33"/>
      <circle id="led-l1" cx="160" cy="128" r="2.5" fill="#113322"/>
      <!-- Center LED: 0° -->
      <circle id="led-c"  cx="170" cy="127" r="3" fill="#00ff88" filter="drop-shadow(0 0 4px #00ff88)"/>
      <!-- Right LEDs: +10°, +20°, +30°, +40° -->
      <circle id="led-r1" cx="180" cy="128" r="2.5" fill="#113322"/>
      <circle id="led-r2" cx="190" cy="131" r="2.5" fill="#112d33"/>
      <circle id="led-r3" cx="200" cy="136" r="2.5" fill="#332211"/>
      <circle id="led-r4" cx="208" cy="144" r="2.5" fill="#331111"/>

      <!-- Center Logo & Emblem -->
      <!-- Stylized AR Head-Up Trajectory Monogram -->
      <path d="M 160 162 L 170 148 L 180 162" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" id="logo-arrow"/>
      <path d="M 164 168 L 170 159 L 176 168" stroke="rgba(0,240,255,.5)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Center Horn Text -->
      <text x="170" y="186" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="700" font-size="7.5" letter-spacing="1.5" fill="rgba(255,255,255,.7)">HORN</text>
      <text x="170" y="197" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="7" letter-spacing="1" fill="rgba(0,240,255,.6)">SNAP 0°</text>
    </svg>
  </div>

  <!-- Right Paddle Shifter (+5°) -->
  <button class="paddle-shifter paddle-right" id="paddle-right" title="Shift Right +5°">
    <span class="paddle-label">+</span>

<!-- Quick Angle Ticks Display -->

  <span>−30°</span>
  <span>−15°</span>
  <span>0°</span>
  <span>+15°</span>
  <span>+30°</span>
  <span>+45°</span>

<!-- Cockpit Acceleration & Brake Pedals Stage -->
<div class="pedals-stage">
  <button class="pedal-btn pedal-brake" id="pedal-brake" title="Brake Pedal [Hold to Stop, or Key S]">

  <div class="cockpit-dash">
    <div class="dash-speed-group">

      <div class="dash-rpm-bar" id="dash-rpm"></div>

  <button class="pedal-btn pedal-gas" id="pedal-gas" title="Gas Pedal [Hold to Accelerate, or Key W]">

<!-- Ultrasonic Proximity Hazard Section (Dual HC-SR04 Sensors) -->
<div class="distance-section">
  <div class="distance-header">
    <span>ULTRASONIC SENSORS (HC-SR04)</span>
    <span id="hazard-tag" style="color:rgba(255,255,255,.3)">NORMAL</span>
  </div>

  <div class="dual-dist-row">
    <!-- Sensor 1 (Left) -->
    <div class="sensor-card" id="sensor-card-l">
      <div class="sensor-title">S1 (LEFT)</div>
      <div class="dist-stepper">
        <button class="dist-btn" id="dist-l-down">−</button>
        <div class="dist-val" id="dist-l-val">55 CM</div>
        <button class="dist-btn" id="dist-l-up">+</button>
      </div>
    </div>

    <!-- Sensor 2 (Right) -->
    <div class="sensor-card" id="sensor-card-r">
      <div class="sensor-title">S2 (RIGHT)</div>
      <div class="dist-stepper">
        <button class="dist-btn" id="dist-r-down">−</button>
        <div class="dist-val" id="dist-r-val">55 CM</div>
        <button class="dist-btn" id="dist-r-up">+</button>
      </div>
    </div>
  </div>

  <div class="presets">
    <button class="preset-btn test-btn-yellow" id="test-left-btn" title="Left sensor <30cm (Left line yellow)">LEFT &lt;30</button>
    <button class="preset-btn test-btn-yellow" id="test-right-btn" title="Right sensor <30cm (Right line yellow)">RIGHT &lt;30</button>
    <button class="preset-btn hazard-preset" id="test-both-btn" title="Both sensors <30cm (Both yellow + Hazard Alert)">BOTH &lt;30</button>

<!-- Bottom Status -->
<div class="bottom-bar">
  <div>
    <span class="status-dot" id="conn-dot"></span>
    <span id="conn-text">BROADCAST & CLOUD SYNC</span>
  </div>
  <div id="room-display">ROOM: SPATIAL-77</div>
</div>

<script>
(() => {
  'use strict';

  /* ════════════════════════════════════════════════════════════════════════
   * 1. STATE & TELEMETRY BUS
   * ════════════════════════════════════════════════════════════════════════ */
  let steerAngle = 0.0;     // degrees: -45.0 to +45.0
  let distLeftCm = 55;      // Sensor 1 (Left) cm
  let distRightCm = 55;     // Sensor 2 (Right) cm
  let distanceCm = 55;      // min distance
  const HAZARD_THRESH = 30; // cm: proximity trigger threshold (<30cm yellow)
  
  let autoCenter = true;    // spring back to 0° on release
  let gyroActive = false;   // phone tilt mode
  let audioEnabled = true;  // audio feedback & horn
  let springAnimId = null;  // spring animation request id

  // ── Vehicle Longitudinal Physics State ──
  let currentSpeedKmh = 0.0;
  let targetThrottle = 0.0;  // 0.0 to 1.0 (gas pedal)
  let targetBrake = 0.0;     // 0.0 to 1.0 (brake pedal)
  let currentRpm = 850;      // idle RPM: 850, redline: 7200
  const MAX_SPEED_KMH = 180.0;
  const ENGINE_IDLE_RPM = 850;
  const ENGINE_REDLINE_RPM = 7200;

  // Steering angular velocity for realistic inertia
  let angularVelocity = 0.0;
  let lastMoveTime = performance.now();
  let lastMoveAngle = 0.0;

  const readout        = document.getElementById('angle-readout');
  const arrowLeft      = document.getElementById('arrow-left');
  const arrowRight     = document.getElementById('arrow-right');
  const directionSub   = document.getElementById('direction-sub');
  
  const wheelContainer = document.getElementById('wheel-container');
  const wheelSvg       = document.getElementById('wheel-svg');
  const racingStripe   = document.getElementById('racing-stripe');
  const hubRing        = document.getElementById('hub-ring');
  const logoArrow      = document.getElementById('logo-arrow');
  
  const sensorCardL    = document.getElementById('sensor-card-l');
  const sensorCardR    = document.getElementById('sensor-card-r');
  const distLVal       = document.getElementById('dist-l-val');
  const distRVal       = document.getElementById('dist-r-val');
  const hazardTag      = document.getElementById('hazard-tag');

  // Cockpit Dash Elements
  const dashSpeedVal   = document.getElementById('dash-speed');
  const dashRpmBar     = document.getElementById('dash-rpm');

  /* ── Rev / Telemetry Steering LEDs ── */
  const ledL4 = document.getElementById('led-l4');
  const ledL3 = document.getElementById('led-l3');
  const ledL2 = document.getElementById('led-l2');
  const ledL1 = document.getElementById('led-l1');
  const ledC  = document.getElementById('led-c');
  const ledR1 = document.getElementById('led-r1');
  const ledR2 = document.getElementById('led-r2');
  const ledR3 = document.getElementById('led-r3');
  const ledR4 = document.getElementById('led-r4');

  /* ════════════════════════════════════════════════════════════════════════
   * 2. SYNTHESIZED WEB AUDIO & HAPTICS
   * ════════════════════════════════════════════════════════════════════════ */
  let audioCtx = null;
  function getAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  // Synthesized Engine Sound (Continuous Dynamic Drone)
  let engineOsc1 = null;
  let engineOsc2 = null;
  let engineGain = null;

  function initEngineAudio() {
    if (!audioEnabled || engineOsc1) return;
    try {
      const ctx = getAudioContext();
      engineOsc1 = ctx.createOscillator();
      engineOsc2 = ctx.createOscillator();
      engineGain = ctx.createGain();

      engineOsc1.type = 'sawtooth';
      engineOsc2.type = 'triangle';

      engineOsc1.frequency.setValueAtTime(45, ctx.currentTime);
      engineOsc2.frequency.setValueAtTime(90, ctx.currentTime);

      engineGain.gain.setValueAtTime(0.0001, ctx.currentTime);

      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(450, ctx.currentTime);

      engineOsc1.connect(filter);
      engineOsc2.connect(filter);
      filter.connect(engineGain);
      engineGain.connect(ctx.destination);

      engineOsc1.start();
      engineOsc2.start();
    } catch (_) {}
  }

  function updateEngineSound(rpm, throttle) {
    if (!audioEnabled || !engineGain || !engineOsc1) return;
    try {
      const ctx = getAudioContext();
      const baseFreq = 32 + (rpm / 7200) * 165; // 32Hz idle to ~197Hz redline
      engineOsc1.frequency.setTargetAtTime(baseFreq, ctx.currentTime, 0.05);
      engineOsc2.frequency.setTargetAtTime(baseFreq * 1.5, ctx.currentTime, 0.05);

      const targetVol = audioEnabled && (currentSpeedKmh > 0.4 || throttle > 0.04)
        ? Math.min(0.055, 0.012 + throttle * 0.038 + (currentSpeedKmh / 180) * 0.018)
        : 0.002;
      engineGain.gain.setTargetAtTime(targetVol, ctx.currentTime, 0.08);
    } catch (_) {}
  }

  // Dual-tone Automotive Horn
  function playHorn() {
    if (!audioEnabled) return;
    try {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      
      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const gain = ctx.createGain();

      osc1.type = 'triangle';
      osc2.type = 'sawtooth';
      osc1.frequency.setValueAtTime(420, now); // Low note
      osc2.frequency.setValueAtTime(530, now); // High note

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.12, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(ctx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 0.22);
      osc2.stop(now + 0.22);

      if ('vibrate' in navigator) navigator.vibrate(60);
    } catch (_) {}
  }

  // Subtle Mechanical Steering Ratchet Tick
  function playRatchetClick() {
    if (!audioEnabled) return;
    try {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(900, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.02);

      gain.gain.setValueAtTime(0.025, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.02);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.02);
    } catch (_) {}
  }

  // Ultrasonic Proximity Hazard Warning Beep
  function playHazardBeep() {
    if (!audioEnabled) return;
    try {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'square';
      osc.frequency.setValueAtTime(880, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.12);

      if ('vibrate' in navigator) navigator.vibrate([80, 40, 80]);
    } catch (_) {}
  }

  /* ════════════════════════════════════════════════════════════════════════
   * 3. DATA TRANSMISSION (BROADCAST & MQTT)
   * ════════════════════════════════════════════════════════════════════════ */
  let bc;
  try {
    bc = new BroadcastChannel('spatialdrive');
  } catch (_) {}

  const urlParams = new URLSearchParams(window.location.search);
  let ROOM_CODE = (urlParams.get('room') || 'SPATIAL-77').toUpperCase().trim();

  const connDot = document.getElementById('conn-dot');
  const connText = document.getElementById('conn-text');
  const roomDisplay = document.getElementById('room-display');

  function updateRoomUI() {
    if (roomDisplay) {
      roomDisplay.textContent = `ROOM: ${ROOM_CODE}`;
      roomDisplay.style.cursor = 'pointer';
      roomDisplay.title = 'Click to switch room code';
    }
  }
  updateRoomUI();

  if (roomDisplay) {
    roomDisplay.addEventListener('click', () => {
      const nextRoom = prompt('Enter Room Code to pair with HUD:', ROOM_CODE);
      if (nextRoom && nextRoom.trim()) {
        ROOM_CODE = nextRoom.toUpperCase().trim();
        updateRoomUI();
        initMqttController();
      }
    });
  }

  /* ── Multi-Broker Wireless Engine with Automatic Failover ── */
  const MQTT_BROKERS = [
    { name: 'EMQX (Default)', url: 'wss://broker.emqx.io:8084/mqtt' },
    { name: 'HiveMQ (Fallback)', url: 'wss://broker.hivemq.com:8884/mqtt' },
    { name: 'Mosquitto', url: 'wss://test.mosquitto.org:8081/mqtt' }
  ];
  let currentBrokerIndex = parseInt(localStorage.getItem('spatial_broker_idx') || '0', 10);
  if (isNaN(currentBrokerIndex) || currentBrokerIndex >= MQTT_BROKERS.length) currentBrokerIndex = 0;

  let mqttClient = null;
  let brokerFailoverTimer = null;

  function initMqttController() {
    if (mqttClient) {
      try { mqttClient.end(true); } catch (_) {}
    }
    if (brokerFailoverTimer) {
      clearTimeout(brokerFailoverTimer);
      brokerFailoverTimer = null;
    }

    const broker = MQTT_BROKERS[currentBrokerIndex];
    if (connText) connText.textContent = `CONNECTING: ${broker.name} (${ROOM_CODE})...`;

    // Failover if broker doesn't connect within 4.5 seconds
    brokerFailoverTimer = setTimeout(() => {
      if (!mqttClient || !mqttClient.connected) {
        console.warn(`Controller broker ${broker.name} timed out. Failing over...`);
        currentBrokerIndex = (currentBrokerIndex + 1) % MQTT_BROKERS.length;
        localStorage.setItem('spatial_broker_idx', currentBrokerIndex.toString());
        initMqttController();
      }
    }, 4500);

    try {
      mqttClient = mqtt.connect(broker.url, {
        clientId: 'ctrl_' + Math.random().toString(16).slice(2, 8),
        keepalive: 30,
        reconnectPeriod: 2500
      });

      mqttClient.on('connect', () => {
        if (brokerFailoverTimer) {
          clearTimeout(brokerFailoverTimer);
          brokerFailoverTimer = null;
        }
        localStorage.setItem('spatial_broker_idx', currentBrokerIndex.toString());
        if (connDot) {
          connDot.style.background = '#00f0ff';
          connDot.style.boxShadow = '0 0 8px #00f0ff';
        }
        if (connText) connText.textContent = `CLOUD SYNC: ${broker.name} (${ROOM_CODE})`;
      });

      mqttClient.on('error', () => {
        if (connDot) {
          connDot.style.background = '#ff0055';
          connDot.style.boxShadow = '0 0 8px #ff0055';
        }
        if (connText) connText.textContent = `${broker.name} ERROR. RETRYING...`;
      });

      mqttClient.on('offline', () => {
        if (connDot) {
          connDot.style.background = '#ffaa00';
          connDot.style.boxShadow = '0 0 8px #ffaa00';
        }
        if (connText) connText.textContent = 'CLOUD OFFLINE';
      });
    } catch (_) {
      if (connText) connText.textContent = 'LOCAL BROADCAST ONLY';
    }
  }
  initMqttController();

  /* ── Web Serial API (Arduino Nano + 2 HC-SR04 Sensors @ 9600 Baud) ── */
  let ctrlSerialPort = null;
  let ctrlSerialReader = null;
  const ctrlSerialBaud = 9600;

  function parseArduinoTelemetry(raw) {
    raw = raw.trim();
    if (!raw) return null;
    const m1 = raw.match(/Sensor\s*1:\s*(-?\d+|No\s*Echo)/i);
    const m2 = raw.match(/Sensor\s*2:\s*(-?\d+|No\s*Echo)/i);
    if (m1 || m2) {
      let d1 = 999;
      let d2 = 999;
      if (m1) {
        const val1 = m1[1].trim();
        d1 = (val1.toLowerCase().includes('echo') || parseInt(val1, 10) < 0) ? 999 : parseInt(val1, 10);
      }
      if (m2) {
        const val2 = m2[1].trim();
        d2 = (val2.toLowerCase().includes('echo') || parseInt(val2, 10) < 0) ? 999 : parseInt(val2, 10);
      }
      return { distL: d1, distR: d2 };
    }
    if (raw.startsWith('{') && raw.endsWith('}')) {
      try {
        const data = JSON.parse(raw);
        const l = data.d1 ?? data.distL ?? data.left ?? data.distance1;
        const r = data.d2 ?? data.distR ?? data.right ?? data.distance2;
        return {
          distL: typeof l === 'number' ? l : 999,
          distR: typeof r === 'number' ? r : 999,
          angle: typeof data.angle === 'number' ? data.angle : undefined
        };
      } catch (_) {}
    }
    const nums = raw.match(/[-+]?\d*\.?\d+/g);
    if (nums && nums.length >= 2) {
      return { distL: parseFloat(nums[0]), distR: parseFloat(nums[1]) };
    } else if (nums && nums.length === 1) {
      return { distL: parseFloat(nums[0]), distR: parseFloat(nums[0]) };
    }
    return null;
  }

  async function connectCtrlSerial() {
    if (!('serial' in navigator)) {
      alert('Web Serial API is available in Chrome, Edge, and Opera (Desktop or Android via USB-OTG). Safari and iOS do not support Web Serial.');
      return;
    }
    try {
      ctrlSerialPort = await navigator.requestPort();
      await ctrlSerialPort.open({ baudRate: ctrlSerialBaud });
      const textDecoder = new TextDecoderStream();
      ctrlSerialPort.readable.pipeTo(textDecoder.writable);
      ctrlSerialReader = textDecoder.readable.getReader();
      
      const btnSer = document.getElementById('btn-ctrl-serial');
      if (btnSer) {
        btnSer.classList.add('active');
        btnSer.textContent = 'NANO: 9600';
      }

      let buffer = '';
      while (true) {
        const { value, done } = await ctrlSerialReader.read();
        if (done) break;
        buffer += value;
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          const parsed = parseArduinoTelemetry(line);
          if (parsed) {
            if (typeof parsed.distL === 'number') distLeftCm = parsed.distL;
            if (typeof parsed.distR === 'number') distRightCm = parsed.distR;
            distanceCm = Math.min(distLeftCm, distRightCm);
            if (typeof parsed.angle === 'number') steerAngle = parsed.angle;
            updateUI();
          }
        }
      }
    } catch (err) {
      console.warn('Serial error or cancelled', err);
      const btnSer = document.getElementById('btn-ctrl-serial');
      if (btnSer) {
        btnSer.classList.remove('active');
        btnSer.textContent = 'NANO USB';
      }
    }
  }

  const btnCtrlSerial = document.getElementById('btn-ctrl-serial');
  if (btnCtrlSerial) btnCtrlSerial.addEventListener('click', connectCtrlSerial);

  let lastTransmitTime = 0;
  let pendingTransmitTimer = null;

  function transmit(force = false) {
    const payload = {
      angle: Number(steerAngle.toFixed(1)),
      distL: Math.round(distLeftCm),
      distR: Math.round(distRightCm),
      distance: Math.min(Math.round(distLeftCm), Math.round(distRightCm)),
      speed: Math.round(currentSpeedKmh),
      rpm: Math.round(currentRpm)
    };
    // 1. Local Same-Device BroadcastChannel
    if (bc) {
      try { bc.postMessage(payload); } catch (_) {}
    }
    // 2. Cross-Device Cloud MQTT (smooth ~35Hz stream to prevent packet clumping & network jitter)
    if (mqttClient && mqttClient.connected) {
      const now = performance.now();
      if (force || now - lastTransmitTime >= 28) {
        lastTransmitTime = now;
        if (pendingTransmitTimer) {
          clearTimeout(pendingTransmitTimer);
          pendingTransmitTimer = null;
        }
        try {
          mqttClient.publish(`spatialdrive/${ROOM_CODE}/telemetry`, JSON.stringify(payload));
        } catch (_) {}
      } else if (!pendingTransmitTimer) {
        pendingTransmitTimer = setTimeout(() => {
          pendingTransmitTimer = null;
          lastTransmitTime = performance.now();
          try {
            mqttClient.publish(`spatialdrive/${ROOM_CODE}/telemetry`, JSON.stringify(payload));
          } catch (_) {}
        }, 28);
      }
    }
  }

  /* ════════════════════════════════════════════════════════════════════════
   * 4. VEHICLE LONGITUDINAL DYNAMICS & TELEMETRY
   * ════════════════════════════════════════════════════════════════════════ */
  function updateVehiclePhysics(dt) {
    // 1. Throttle Acceleration (non-linear torque curve)
    if (targetThrottle > 0) {
      const accelPower = Math.max(14.0, 42.0 * (1.0 - (currentSpeedKmh / (MAX_SPEED_KMH * 1.1))));
      currentSpeedKmh += accelPower * targetThrottle * dt;
    }
    // 2. Hydraulic Brake Deceleration
    if (targetBrake > 0) {
      currentSpeedKmh -= 82.0 * targetBrake * dt;
    }
    // 3. Aerodynamic Drag & Rolling Friction: F_drag ~ v^2
    const drag = (0.55 + 0.0032 * currentSpeedKmh * currentSpeedKmh) * dt;
    if (targetThrottle === 0) {
      currentSpeedKmh -= drag;
    }
    currentSpeedKmh = Math.max(0.0, Math.min(MAX_SPEED_KMH, currentSpeedKmh));

    // 4. Simulated 7-Speed Dual-Clutch / High-Performance RPM
    if (currentSpeedKmh < 0.8 && targetThrottle === 0) {
      currentRpm += (ENGINE_IDLE_RPM - currentRpm) * Math.min(1.0, 7.0 * dt);
    } else {
      const gearRatio = 38.0; // RPM per km/h cruising ratio
      const throttleLoadRpm = targetThrottle * 1950;
      const targetRpmVal = Math.min(ENGINE_REDLINE_RPM, ENGINE_IDLE_RPM + currentSpeedKmh * gearRatio + throttleLoadRpm);
      currentRpm += (targetRpmVal - currentRpm) * Math.min(1.0, 15.0 * dt);
    }

    // Update Cockpit Dash Elements
    if (dashSpeedVal) {
      dashSpeedVal.textContent = Math.round(currentSpeedKmh).toString();
    }
    if (dashRpmBar) {
      const rpmPercent = Math.min(100, Math.max(0, ((currentRpm - ENGINE_IDLE_RPM) / (ENGINE_REDLINE_RPM - ENGINE_IDLE_RPM)) * 100));
      dashRpmBar.style.width = `${rpmPercent.toFixed(1)}%`;
    }
  }

  /* ════════════════════════════════════════════════════════════════════════
   * 5. UI & STEERING WHEEL RENDERER
   * ════════════════════════════════════════════════════════════════════════ */
  let prevHazard = false;
  let lastDetentAngle = 0;

  function updateUI() {
    distanceCm = Math.min(distLeftCm, distRightCm);
    const isLeftWarn = (distLeftCm > 0 && distLeftCm < HAZARD_THRESH);
    const isRightWarn = (distRightCm > 0 && distRightCm < HAZARD_THRESH);
    // User rule: no hazard warning until both turning yellow
    const isHazard = isLeftWarn && isRightWarn;

    // Trigger hazard alert sound/vibe on state change
    if (isHazard && !prevHazard) {
      playHazardBeep();
    }
    prevHazard = isHazard;

    // ── 1. Rotate SVG Steering Wheel ──
    wheelSvg.style.transform = `rotate(${steerAngle}deg)`;
    wheelSvg.classList.toggle('hazard', isHazard);

    // Hazard visual styling on wheel accents
    if (isHazard) {
      racingStripe.setAttribute('fill', '#FF8C00');
      racingStripe.setAttribute('filter', 'drop-shadow(0 0 8px #FF8C00)');
      hubRing.setAttribute('stroke', '#FF8C00');
      logoArrow.setAttribute('stroke', '#FF8C00');
    } else {
      racingStripe.setAttribute('fill', '#00f0ff');
      racingStripe.setAttribute('filter', 'drop-shadow(0 0 6px #00f0ff)');
      hubRing.setAttribute('stroke', 'rgba(0,240,255,.4)');
      logoArrow.setAttribute('stroke', '#00f0ff');
    }

    // ── 2. Telemetry Readout & Direction Arrows ──
    const sign = steerAngle > 0.05 ? '+' : '';
    readout.textContent = `${sign}${steerAngle.toFixed(1)}°`;
    readout.classList.toggle('hazard', isHazard);

    const isLeft = steerAngle < -0.4;
    const isRight = steerAngle > 0.4;
    arrowLeft.classList.toggle('active', isLeft);
    arrowRight.classList.toggle('active', isRight);
    arrowLeft.classList.toggle('hazard', isHazard);
    arrowRight.classList.toggle('hazard', isHazard);

    if (Math.abs(steerAngle) < 0.5) {
      directionSub.textContent = 'CENTERED';
      directionSub.style.color = isHazard ? '#FF8C00' : 'rgba(0,240,255,.7)';
    } else if (steerAngle < 0) {
      directionSub.textContent = 'STEER LEFT';
      directionSub.style.color = isHazard ? '#FF8C00' : 'rgba(255,255,255,.6)';
    } else {
      directionSub.textContent = 'STEER RIGHT';
      directionSub.style.color = isHazard ? '#FF8C00' : 'rgba(255,255,255,.6)';
    }

    // ── 3. Steering Wheel Rev & Shift LEDs ──
    updateWheelLeds(steerAngle, currentRpm);

    // ── 4. Distance Telemetry Section (Dual Sensors) ──
    if (distLVal) distLVal.textContent = (distLeftCm > 0 && distLeftCm < 400) ? `${Math.round(distLeftCm)} CM` : '---';
    if (distRVal) distRVal.textContent = (distRightCm > 0 && distRightCm < 400) ? `${Math.round(distRightCm)} CM` : '---';

    if (sensorCardL) {
      sensorCardL.classList.toggle('yellow', isLeftWarn && !isHazard);
      sensorCardL.classList.toggle('hazard', isHazard);
    }
    if (sensorCardR) {
      sensorCardR.classList.toggle('yellow', isRightWarn && !isHazard);
      sensorCardR.classList.toggle('hazard', isHazard);
    }

    if (hazardTag) {
      if (isHazard) {
        hazardTag.textContent = '⚠ BOTH SENSORS <30CM (CRITICAL HAZARD)';
        hazardTag.style.color = '#FF8C00';
      } else if (isLeftWarn && !isRightWarn) {
        hazardTag.textContent = 'LEFT SENSOR <30CM (LEFT YELLOW)';
        hazardTag.style.color = '#FFD700';
      } else if (isRightWarn && !isLeftWarn) {
        hazardTag.textContent = 'RIGHT SENSOR <30CM (RIGHT YELLOW)';
        hazardTag.style.color = '#FFD700';
      } else {
        hazardTag.textContent = 'NORMAL';
        hazardTag.style.color = 'rgba(255,255,255,.3)';
      }
    }

    // Transmit over bus
    transmit();
  }

  // Update Steering Angle & GT3 Shift LEDs on Wheel Hub
  function updateWheelLeds(ang, rpm) {
    const abs = Math.abs(ang);
    const isNeg = ang < -1.0;
    const isPos = ang > 1.0;

    // RPM Shift lights threshold
    const rpmNorm = Math.min(1.0, Math.max(0.0, (rpm - 1800) / (ENGINE_REDLINE_RPM - 1800)));

    // Center LED
    ledC.setAttribute('fill', abs < 2.0 || rpmNorm > 0.25 ? '#00ff88' : '#113322');
    ledC.setAttribute('filter', abs < 2.0 || rpmNorm > 0.25 ? 'drop-shadow(0 0 5px #00ff88)' : 'none');

    // Left LEDs (Steering lock or RPM progressive shift lights)
    const l1 = (isNeg && abs >= 8)  || rpmNorm > 0.35;
    const l2 = (isNeg && abs >= 18) || rpmNorm > 0.55;
    const l3 = (isNeg && abs >= 28) || rpmNorm > 0.75;
    const l4 = (isNeg && abs >= 38) || rpmNorm > 0.90;

    ledL1.setAttribute('fill', l1 ? '#00ff88' : '#113322');
    ledL2.setAttribute('fill', l2 ? '#00f0ff' : '#112d33');
    ledL3.setAttribute('fill', l3 ? '#ffaa00' : '#332211');
    ledL4.setAttribute('fill', l4 ? '#ff3333' : '#331111');

    // Right LEDs
    const r1 = (isPos && abs >= 8)  || rpmNorm > 0.35;
    const r2 = (isPos && abs >= 18) || rpmNorm > 0.55;
    const r3 = (isPos && abs >= 28) || rpmNorm > 0.75;
    const r4 = (isPos && abs >= 38) || rpmNorm > 0.90;

    ledR1.setAttribute('fill', r1 ? '#00ff88' : '#113322');
    ledR2.setAttribute('fill', r2 ? '#00f0ff' : '#112d33');
    ledR3.setAttribute('fill', r3 ? '#ffaa00' : '#332211');
    ledR4.setAttribute('fill', r4 ? '#ff3333' : '#331111');
  }

  // Check Ratchet Audio Feedback Detents (every 4.5 degrees)
  function checkDetentSounds(oldAng, newAng) {
    if (Math.floor(Math.abs(newAng) / 4.5) !== Math.floor(Math.abs(oldAng) / 4.5)) {
      playRatchetClick();
    }
  }

  /* ════════════════════════════════════════════════════════════════════════
   * 6. ROTATIONAL STEERING WHEEL TOUCH & MOUSE INTERACTION (REALISTIC PHYSICS)
   * ════════════════════════════════════════════════════════════════════════ */
  let isDragging = false;
  let lastPointerAngle = 0;

  function getAngleFromCenter(clientX, clientY) {
    const rect = wheelContainer.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = clientX - cx;
    const dy = clientY - cy;
    return Math.atan2(dy, dx) * 180 / Math.PI; // -180° to +180°
  }

  wheelContainer.addEventListener('pointerdown', (e) => {
    if (gyroActive) return;
    if (e.target.closest('#horn-hitbox')) return; // horn handles its own tap
    initEngineAudio();
    isDragging = true;
    wheelContainer.setPointerCapture(e.pointerId);
    if (springAnimId) {
      cancelAnimationFrame(springAnimId);
      springAnimId = null;
    }
    lastPointerAngle = getAngleFromCenter(e.clientX, e.clientY);
    lastMoveTime = performance.now();
    lastMoveAngle = steerAngle;
    angularVelocity = 0.0;
  });

  wheelContainer.addEventListener('pointermove', (e) => {
    if (!isDragging || gyroActive) return;
    const currentAngle = getAngleFromCenter(e.clientX, e.clientY);
    let delta = currentAngle - lastPointerAngle;
    
    // Handle wrap across 180° / -180° boundary
    while (delta > 180) delta -= 360;
    while (delta < -180) delta += 360;

    const now = performance.now();
    const dt = Math.max(0.001, (now - lastMoveTime) / 1000);
    const oldAngle = steerAngle;
    steerAngle = Math.max(-45.0, Math.min(45.0, steerAngle + delta));
    
    // Realistic angular momentum calculation
    angularVelocity = ((steerAngle - lastMoveAngle) / dt) * 0.016;
    lastMoveTime = now;
    lastMoveAngle = steerAngle;
    lastPointerAngle = currentAngle;

    checkDetentSounds(oldAngle, steerAngle);
    updateUI();
  });

  function stopDrag() {
    if (!isDragging) return;
    isDragging = false;
    if (autoCenter && !gyroActive) {
      animateReturnToCenter();
    }
  }
  wheelContainer.addEventListener('pointerup', stopDrag);
  wheelContainer.addEventListener('pointercancel', stopDrag);

  // Center Horn & Snap Re-Center
  const hornHitbox = document.getElementById('horn-hitbox');
  hornHitbox.addEventListener('click', (e) => {
    e.stopPropagation();
    playHorn();
    snapToCenter();
  });

  function snapToCenter() {
    if (springAnimId) cancelAnimationFrame(springAnimId);
    steerAngle = 0.0;
    angularVelocity = 0.0;
    updateUI();
  }

  // Speed-Sensitive Self-Aligning Caster Return Torque (Real Vehicle Physics: tau ~ v)
  function getCasterTorqueRate() {
    const speedNorm = Math.min(1.0, currentSpeedKmh / 120.0);
    // At 0 km/h: light return (0.16); at 120+ km/h: strong caster return (0.36)
    return 0.16 + 0.20 * speedNorm;
  }

  function animateReturnToCenter() {
    if (springAnimId) cancelAnimationFrame(springAnimId);
    function spring() {
      if (isDragging || gyroActive) return;

      // Realistic rotational momentum decay
      if (Math.abs(angularVelocity) > 0.4) {
        steerAngle = Math.max(-45.0, Math.min(45.0, steerAngle + angularVelocity));
        angularVelocity *= 0.88; // rotational friction
      }

      const casterRate = getCasterTorqueRate();
      steerAngle += (0 - steerAngle) * casterRate;

      if (Math.abs(steerAngle) < 0.15 && Math.abs(angularVelocity) < 0.4) {
        steerAngle = 0.0;
        angularVelocity = 0.0;
        updateUI();
        springAnimId = null;
        return;
      }
      updateUI();
      springAnimId = requestAnimationFrame(spring);
    }
    springAnimId = requestAnimationFrame(spring);
  }

  /* ════════════════════════════════════════════════════════════════════════
   * 7. ACCELERATION & BRAKE PEDAL CONTROLS
   * ════════════════════════════════════════════════════════════════════════ */
  const pedalGas = document.getElementById('pedal-gas');
  const pedalBrake = document.getElementById('pedal-brake');

  function bindPedalEvents(el, isGas) {
    if (!el) return;
    const startPress = (e) => {
      e.preventDefault();
      initEngineAudio();
      el.classList.add('pressed');
      if (isGas) {
        targetThrottle = 1.0;
        targetBrake = 0.0;
        if (pedalBrake) pedalBrake.classList.remove('pressed');
      } else {
        targetBrake = 1.0;
        targetThrottle = 0.0;
        if (pedalGas) pedalGas.classList.remove('pressed');
      }
      if ('vibrate' in navigator) navigator.vibrate(25);
    };

    const endPress = (e) => {
      e.preventDefault();
      el.classList.remove('pressed');
      if (isGas) {
        targetThrottle = 0.0;
      } else {
        targetBrake = 0.0;
      }
    };

    el.addEventListener('pointerdown', startPress);
    el.addEventListener('pointerup', endPress);
    el.addEventListener('pointercancel', endPress);
    el.addEventListener('pointerleave', endPress);
  }

  bindPedalEvents(pedalGas, true);
  bindPedalEvents(pedalBrake, false);

  /* ════════════════════════════════════════════════════════════════════════
   * 8. PADDLE SHIFTERS & QUICK CONTROLS
   * ════════════════════════════════════════════════════════════════════════ */
  const paddleLeft = document.getElementById('paddle-left');
  const paddleRight = document.getElementById('paddle-right');

  paddleLeft.addEventListener('click', () => {
    if (springAnimId) cancelAnimationFrame(springAnimId);
    steerAngle = Math.max(-45.0, steerAngle - 5.0);
    playRatchetClick();
    updateUI();
    if (autoCenter && !isDragging && !gyroActive) animateReturnToCenter();
  });

  paddleRight.addEventListener('click', () => {
    if (springAnimId) cancelAnimationFrame(springAnimId);
    steerAngle = Math.min(45.0, steerAngle + 5.0);
    playRatchetClick();
    updateUI();
    if (autoCenter && !isDragging && !gyroActive) animateReturnToCenter();
  });

  // Auto-Center Toggle Button
  const btnAutoCenter = document.getElementById('btn-autocenter');
  btnAutoCenter.addEventListener('click', () => {
    autoCenter = !autoCenter;
    btnAutoCenter.classList.toggle('active', autoCenter);
    btnAutoCenter.textContent = `SPRING: ${autoCenter ? 'ON' : 'OFF'}`;
    if (autoCenter && !isDragging && !gyroActive) animateReturnToCenter();
  });

  /* ════════════════════════════════════════════════════════════════════════
   * 9. KEYBOARD REALISTIC STEERING & PEDALS
   * ════════════════════════════════════════════════════════════════════════ */
  const keysDown = {};
  window.addEventListener('keydown', (e) => {
    initEngineAudio();
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'w', 'W', 's', 'S', 'a', 'A', 'd', 'D', ' ', '0', 'c', 'C'].includes(e.key)) {
      e.preventDefault();
    }
    keysDown[e.key.toLowerCase()] = true;
    
    // Gas / Throttle Shortcut (W or ArrowUp)
    if (e.key.toLowerCase() === 'w' || e.key === 'ArrowUp') {
      targetThrottle = 1.0;
      targetBrake = 0.0;
      if (pedalGas) pedalGas.classList.add('pressed');
      if (pedalBrake) pedalBrake.classList.remove('pressed');
    }
    // Brake Shortcut (S or ArrowDown)
    if (e.key.toLowerCase() === 's' || e.key === 'ArrowDown') {
      targetBrake = 1.0;
      targetThrottle = 0.0;
      if (pedalBrake) pedalBrake.classList.add('pressed');
      if (pedalGas) pedalGas.classList.remove('pressed');
    }

    if (e.key === ' ' || e.key === '0' || e.key.toLowerCase() === 'c') {
      snapToCenter();
      playHorn();
    }
  });

  window.addEventListener('keyup', (e) => {
    keysDown[e.key.toLowerCase()] = false;

    if (e.key.toLowerCase() === 'w' || e.key === 'ArrowUp') {
      targetThrottle = 0.0;
      if (pedalGas) pedalGas.classList.remove('pressed');
    }
    if (e.key.toLowerCase() === 's' || e.key === 'ArrowDown') {
      targetBrake = 0.0;
      if (pedalBrake) pedalBrake.classList.remove('pressed');
    }

    if (autoCenter && !keysDown['arrowleft'] && !keysDown['arrowright'] && !keysDown['a'] && !keysDown['d']) {
      animateReturnToCenter();
    }
  });

  function keyboardSteerTick() {
    if (keysDown['arrowleft'] || keysDown['a']) {
      if (springAnimId) cancelAnimationFrame(springAnimId);
      const old = steerAngle;
      steerAngle = Math.max(-45.0, steerAngle - 2.0);
      checkDetentSounds(old, steerAngle);
      updateUI();
    } else if (keysDown['arrowright'] || keysDown['d']) {
      if (springAnimId) cancelAnimationFrame(springAnimId);
      const old = steerAngle;
      steerAngle = Math.min(45.0, steerAngle + 2.0);
      checkDetentSounds(old, steerAngle);
      updateUI();
    }
    requestAnimationFrame(keyboardSteerTick);
  }
  requestAnimationFrame(keyboardSteerTick);

  /* ════════════════════════════════════════════════════════════════════════
   * 10. PHONE GYROSCOPE (TILT TO STEER)
   * ════════════════════════════════════════════════════════════════════════ */
  const btnGyro = document.getElementById('btn-gyro');

  async function toggleGyro() {
    if (!gyroActive) {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res !== 'granted') return;
        } catch (_) { return; }
      }
      gyroActive = true;
      btnGyro.classList.add('active');
      btnGyro.textContent = 'GYRO: ACTIVE';
      window.addEventListener('deviceorientation', handleOrientation);
    } else {
      gyroActive = false;
      btnGyro.classList.remove('active');
      btnGyro.textContent = 'GYRO: OFF';
      window.removeEventListener('deviceorientation', handleOrientation);
      snapToCenter();
    }
  }
  btnGyro.addEventListener('click', toggleGyro);

  function handleOrientation(e) {
    if (!gyroActive) return;
    const gamma = e.gamma || 0; // -90 to +90 deg tilt
    const old = steerAngle;
    steerAngle = Math.max(-45.0, Math.min(45.0, gamma * 1.1));
    checkDetentSounds(old, steerAngle);
    updateUI();
  }

  /* ════════════════════════════════════════════════════════════════════════
   * 11. AUDIO TOGGLE & DISTANCE STEPPERS
   * ════════════════════════════════════════════════════════════════════════ */
  const btnAudio = document.getElementById('btn-audio');
  btnAudio.addEventListener('click', () => {
    audioEnabled = !audioEnabled;
    btnAudio.textContent = `AUDIO: ${audioEnabled ? 'ON' : 'OFF'}`;
    btnAudio.classList.toggle('active', audioEnabled);
    if (audioEnabled) {
      getAudioContext();
      initEngineAudio();
    }
  });

  // Dual Sensor Stepper Listeners
  const distLDown = document.getElementById('dist-l-down');
  const distLUp = document.getElementById('dist-l-up');
  const distRDown = document.getElementById('dist-r-down');
  const distRUp = document.getElementById('dist-r-up');

  if (distLDown) distLDown.addEventListener('click', () => {
    distLeftCm = Math.max(2, distLeftCm - 5);
    updateUI();
  });
  if (distLUp) distLUp.addEventListener('click', () => {
    distLeftCm = Math.min(250, distLeftCm + 5);
    updateUI();
  });
  if (distRDown) distRDown.addEventListener('click', () => {
    distRightCm = Math.max(2, distRightCm - 5);
    updateUI();
  });
  if (distRUp) distRUp.addEventListener('click', () => {
    distRightCm = Math.min(250, distRightCm + 5);
    updateUI();
  });

  // Quick Test Buttons
  const testLeftBtn = document.getElementById('test-left-btn');
  const testRightBtn = document.getElementById('test-right-btn');
  const testBothBtn = document.getElementById('test-both-btn');
  const testClearBtn = document.getElementById('test-clear-btn');

  if (testLeftBtn) testLeftBtn.addEventListener('click', () => {
    distLeftCm = 20;  // <30cm -> Left turns yellow
    distRightCm = 85; // Normal cyan
    updateUI();
  });
  if (testRightBtn) testRightBtn.addEventListener('click', () => {
    distLeftCm = 85;  // Normal cyan
    distRightCm = 20; // <30cm -> Right turns yellow
    updateUI();
  });
  if (testBothBtn) testBothBtn.addEventListener('click', () => {
    distLeftCm = 20;  // <30cm
    distRightCm = 18; // <30cm -> Both turn yellow & triggers Hazard alert
    updateUI();
  });
  if (testClearBtn) testClearBtn.addEventListener('click', () => {
    distLeftCm = 999;
    distRightCm = 999;
    updateUI();
  });

  /* ── Continuous Vehicle Physics Loop ── */
  let lastPhysicsTime = performance.now();
  function physicsTick() {
    requestAnimationFrame(physicsTick);
    const now = performance.now();
    const dt = Math.min(0.05, Math.max(0.001, (now - lastPhysicsTime) / 1000));
    lastPhysicsTime = now;

    updateVehiclePhysics(dt);
    updateEngineSound(currentRpm, targetThrottle);
    updateWheelLeds(steerAngle, currentRpm);
  }
  requestAnimationFrame(physicsTick);

  /* ── Periodic Sync Heartbeat ── */
  setInterval(transmit, 35);

  // Initial render
  requestAnimationFrame(() => updateUI());
  window.addEventListener('resize', () => updateUI());
})();
</script>
</body>
